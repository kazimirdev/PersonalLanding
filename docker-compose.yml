services:
  website:
    build:
      context: ./website
      dockerfile: docker/Dockerfile
    container_name: php-website
    ports:
      - "3000:80"
    volumes:
      - ./website:/var/www/html
    depends_on:
      - db

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: docker/Dockerfile
    container_name: php-admin-panel
    ports:
      - "3001:80"
    volumes:
      - ./admin-panel:/var/www/html
    depends_on:
      - db

  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.mysql
    container_name: mysql-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: